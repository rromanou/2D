<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Petit Village</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css?v=7">
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
  <div id="hud" class="pix">
    <div class="row1"><span id="h-money">0 $</span><span id="h-time"></span></div>
    <div class="bars">
      <div class="bar" title="Faim"><label>Faim</label><div class="track"><div id="b-hunger" class="fill f-hunger"></div></div></div>
      <div class="bar" title="Soif"><label>Soif</label><div class="track"><div id="b-thirst" class="fill f-thirst"></div></div></div>
      <div class="bar" title="Santé"><label>Santé</label><div class="track"><div id="b-hp" class="fill f-hp"></div></div></div>
      <div class="bar" title="Endurance"><label>Endur.</label><div class="track"><div id="b-stam" class="fill f-stam"></div></div></div>
      <div class="bar" title="Sommeil"><label>Sommeil</label><div class="track"><div id="b-sleep" class="fill f-sleep"></div></div></div>
      <div class="bar" title="Vessie"><label>Toilet.</label><div class="track"><div id="b-pee" class="fill f-pee"></div></div></div>
      <div class="bar" title="Hygiène"><label>Hygiène</label><div class="track"><div id="b-hyg" class="fill f-hyg"></div></div></div>
      <div class="bar" title="Détente"><label>Détente</label><div class="track"><div id="b-fun" class="fill f-fun"></div></div></div>
    </div>
    <div id="h-job"></div>
    <div id="h-stars"></div>
    <div id="h-equip"></div>
  </div>
  <div id="topbtns">
    <button class="btn" id="btn-bag">Sac [I]</button>
    <button class="btn" id="btn-quest">Quêtes [J]</button>
    <button class="btn" id="btn-build" style="display:none">Aménager [B]</button>
    <button class="btn" id="btn-friends">Amis [R]</button>
    <button class="btn" id="btn-menu">Menu</button>
  </div>
  <canvas id="mini" width="128" height="96"></canvas>
  <div id="hotbar"></div>
  <div id="fam"></div>
  <div id="prompt"></div>
  <div id="toasts"></div>
  <div id="banner"></div>
  <div id="dialog"></div>
  <div id="modal"></div>
  <div id="title"></div>
</div>
<script src="js/fontdata.js?v=7"></script>
<script src="js/util.js?v=7"></script>
<script src="js/sprites.js?v=7"></script>
<script src="js/icons.js?v=7"></script>
<script src="js/data.js?v=7"></script>
<script src="js/world.js?v=7"></script>
<script src="js/ents.js?v=7"></script>
<script src="js/ui.js?v=7"></script>
<script src="js/casino.js?v=7"></script>
<script src="js/casinoui.js?v=7"></script>
<script src="js/game.js?v=7"></script>
<script src="js/actions.js?v=7"></script>
<script src="js/life.js?v=7"></script>
<script src="js/more.js?v=7"></script>
<script src="js/cars.js?v=7"></script>
  <script src="js/police.js?v=7"></script>
<script>
(function () {
  var ff = new FontFace('Pixel', 'url(data:font/ttf;base64,' + RG.fontB64 + ')');
  document.fonts.add(ff);
  ff.load().then(function () { document.body.classList.add('ready'); RG.Game.boot(); })
    .catch(function () { document.body.classList.add('ready'); RG.Game.boot(); });
})();
</script>
</body>
</html>
